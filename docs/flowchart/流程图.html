<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>CiteGuard 流程图</title><style>body{margin:0;background:#fff}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="'WenQuanYi Zen Hei', 'Microsoft YaHei', 'PingFang SC', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#1f2328">CiteGuard 工作流程</text>
<text x="40" y="76" font-size="15" fill="#57606a">左：Agent 在 SKILL.md 约束下的写作循环；右：verify_references 对每条参考文献的核查过程</text>
<rect x="70" y="105" width="420" height="58" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/>
<text x="280.0" y="128.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">用户：写一篇带参考文献的综述</text>
<text x="280.0" y="151.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">例：扩散模型用于农作物病害数据增广，附 15 条文献</text>
<rect x="70" y="195" width="420" height="58" rx="10" fill="#eef4ff" stroke="#4b74c9" stroke-width="1.6"/>
<text x="280.0" y="218.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Claude Code Agent 加载 SKILL.md</text>
<text x="280.0" y="241.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">Skill 规定：先检索、写完核查、按报告修正</text>
<rect x="70" y="285" width="420" height="58" rx="10" fill="#fff4e5" stroke="#c97a1e" stroke-width="1.6"/>
<text x="280.0" y="308.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">search_papers：检索真实论文</text>
<text x="280.0" y="331.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">Crossref，返回带 DOI、卷期页码的完整题录</text>
<rect x="70" y="375" width="420" height="58" rx="10" fill="#eef4ff" stroke="#4b74c9" stroke-width="1.6"/>
<text x="280.0" y="398.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">写初稿</text>
<text x="280.0" y="421.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">正文 + 编号的参考文献列表</text>
<rect x="70" y="465" width="420" height="58" rx="10" fill="#fff4e5" stroke="#c97a1e" stroke-width="1.6"/>
<text x="280.0" y="488.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">verify_references：核查完整列表</text>
<text x="280.0" y="511.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">返回逐条报告（右侧流程）</text>
<polygon points="280.0,559.0 405.0,600 280.0,641.0 155.0,600" fill="#ffffff" stroke="#4b74c9" stroke-width="1.6"/>
<text x="280.0" y="606" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">有 ⚠️ 或 ❌ ？</text>
<rect x="70" y="690" width="420" height="96" rx="10" fill="#eef4ff" stroke="#4b74c9" stroke-width="1.6"/>
<text x="280.0" y="708.8" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">按报告修正</text>
<text x="280.0" y="732.0" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">⚠️ 按「建议改为」整条替换为数据库题录</text>
<text x="280.0" y="755.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">❌ 删除并改写正文对应处，需要时再检索</text>
<text x="280.0" y="778.4" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">❓ 保留并注明未核验</text>
<rect x="70" y="860" width="420" height="58" rx="10" fill="#e9f7ef" stroke="#1a7f37" stroke-width="1.6"/>
<text x="280.0" y="883.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">输出终稿</text>
<text x="280.0" y="906.2" text-anchor="middle" font-size="14" font-weight="400" fill="#57606a">只保留通过核查的文献，并附核查说明</text>
<path d="M 280.0,163 L 280.0,193" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 280.0,253 L 280.0,283" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 280.0,343 L 280.0,373" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 280.0,433 L 280.0,463" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 280.0,523 L 280.0,557" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 280.0,641 L 280.0,688" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="298.0" y="670" font-size="14" fill="#57606a" text-anchor="middle">是</text>
<path d="M 155.0,600 L 30,600 L 30,905 L 68,905" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="100" y="590" font-size="14" fill="#57606a" text-anchor="middle">否（全部通过）</text>
<path d="M 490,738 L 512,738 L 512,508 L 492,508" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="546" y="690" font-size="14" fill="#57606a" text-anchor="middle">再次核查</text>
<text x="546" y="710" font-size="13" fill="#57606a" text-anchor="middle">（最多 3 轮）</text>
<rect x="580" y="100" width="900" height="840" rx="14" fill="none" stroke="#c97a1e" stroke-width="1.4" stroke-dasharray="8 6"/>
<text x="600" y="128" font-size="17" font-weight="700" fill="#c97a1e">verify_references 内部（每条参考文献并发处理）</text>
<path d="M 492,480 L 578,480" fill="none" stroke="#c97a1e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="145" width="520" height="58" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="626" y="168.0" text-anchor="start" font-size="16" font-weight="700" fill="#1f2328">① 解析</text>
<text x="626" y="191.2" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">切分条目，抽取标题、全部作者、年份、DOI、arXiv 编号、页码</text>
<rect x="610" y="228" width="520" height="76" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="626" y="248.4" text-anchor="start" font-size="16" font-weight="700" fill="#1f2328">② 按 DOI 取回元数据（Crossref / doi.org）</text>
<text x="626" y="271.6" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">比对 DOI 指向论文的标题：</text>
<text x="626" y="294.8" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">不一致 → 记录「DOI 指向他文」，继续找正确论文</text>
<rect x="610" y="329" width="520" height="58" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="626" y="352.0" text-anchor="start" font-size="16" font-weight="700" fill="#1f2328">③ arXiv 编号查询（arXiv API）</text>
<text x="626" y="375.2" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">只用于带 arXiv 编号的条目</text>
<rect x="610" y="412" width="520" height="76" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="626" y="432.4" text-anchor="start" font-size="16" font-weight="700" fill="#1f2328">④ 标题检索：Crossref → OpenAlex → Semantic Scholar</text>
<text x="626" y="455.6" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">每源前 5 条按自算相似度重排；找到同一篇即停</text>
<text x="626" y="478.8" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">副标题被改写时，用「名称:」主标题再查一次</text>
<rect x="610" y="513" width="520" height="58" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="626" y="536.0" text-anchor="start" font-size="16" font-weight="700" fill="#1f2328">⑤ 匹配到预印本 → 查找正式发表版本</text>
<text x="626" y="559.2" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">以正式版为准比对，并提示正式 DOI</text>
<rect x="610" y="596" width="520" height="76" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="626" y="616.4" text-anchor="start" font-size="16" font-weight="700" fill="#1f2328">⑥ 逐字段比对</text>
<text x="626" y="639.6" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">全部作者（名字/首字母级、顺序、漏/多）· 年份 ±1</text>
<text x="626" y="662.8" text-anchor="start" font-size="14" font-weight="400" fill="#57606a">首页码 · 标题（副标题不同 / 截断 / 前缀）</text>
<path d="M 870.0,203 L 870.0,226" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870.0,304 L 870.0,327" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870.0,387 L 870.0,410" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870.0,488 L 870.0,511" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870.0,571 L 870.0,594" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870.0,672 L 870.0,710" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610" y="704" font-size="14" fill="#57606a"></text>
<rect x="600.0" y="716" width="207.5" height="62" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
<text x="703.75" y="741" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">✅ VERIFIED</text>
<text x="703.75" y="763" text-anchor="middle" font-size="13" fill="#57606a">存在且题录正确</text>
<rect x="817.5" y="716" width="207.5" height="62" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
<text x="921.25" y="741" text-anchor="middle" font-size="15" font-weight="700" fill="#9a6700">⚠️ MISMATCH</text>
<text x="921.25" y="763" text-anchor="middle" font-size="13" fill="#57606a">附正确题录与差异</text>
<rect x="1035.0" y="716" width="207.5" height="62" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
<text x="1138.75" y="741" text-anchor="middle" font-size="15" font-weight="700" fill="#cf222e">❌ NOT_FOUND</text>
<text x="1138.75" y="763" text-anchor="middle" font-size="13" fill="#57606a">各源都查不到，附候选</text>
<rect x="1252.5" y="716" width="207.5" height="62" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
<text x="1356.25" y="741" text-anchor="middle" font-size="15" font-weight="700" fill="#57606a">❓ UNKNOWN</text>
<text x="1356.25" y="763" text-anchor="middle" font-size="13" fill="#57606a">数据源不可用，不算编造</text>
<path d="M 580,600 L 407.0,600" fill="none" stroke="#c97a1e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="438.0" y="590" font-size="14" fill="#57606a" text-anchor="middle">核查报告</text>
<rect x="1154" y="145" width="306" height="186" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/>
<text x="1170" y="188.9" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328">严重程度</text>
<text x="1170" y="210.6" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">严重：DOI 指向他文 / 不存在、</text>
<text x="1170" y="232.4" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">编造作者、标题不符</text>
<text x="1170" y="254.1" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">次要：名字拼写、作者顺序、</text>
<text x="1170" y="275.9" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">漏作者、年份差 &gt;1、页码</text>
<text x="1170" y="297.6" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">提示：省略副标题、预印本 DOI</text>
<rect x="1154" y="356" width="306" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/>
<text x="1170" y="387.8" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328">容错（来自试跑与演示）</text>
<text x="1170" y="409.5" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">多词姓氏、首字母在前/在后、</text>
<text x="1170" y="431.2" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">名字缩写（Kr.）、姓名颠倒、</text>
<text x="1170" y="453.0" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">机构作者、et al.、</text>
<text x="1170" y="474.8" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">Crossref 早期访问占位页码</text>
<rect x="1154" y="521" width="306" height="151" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/>
<text x="1170" y="558.2" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328">Agent 只拿到</text>
<text x="1170" y="580.0" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">· 逐条状态与差异说明</text>
<text x="1170" y="601.8" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">· 可直接替换的正确题录</text>
<text x="1170" y="623.5" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">· ❌ 条目的真实候选论文</text>
<text x="1170" y="645.2" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">· 下一步怎么做</text>
<rect x="600" y="812" width="860" height="108" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/>
<text x="616" y="838.6" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328">HTTP 层（所有数据源共用）</text>
<text x="616" y="860.4" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">本地 JSON 缓存（含 404，不含密钥）· 按接口限速：Crossref DOI 5 次/秒、检索 1 次/秒、arXiv 3 秒/次</text>
<text x="616" y="882.1" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">429 / 5xx 指数退避 · Retry-After 超过 30 秒（如 OpenAlex 额度耗尽）立即放弃该数据源并暂停使用</text>
<text x="616" y="903.9" text-anchor="start" font-size="13" font-weight="400" fill="#57606a">数据源：Crossref · doi.org（DataCite/arXiv DOI）· OpenAlex · Semantic Scholar · arXiv</text>
<path d="M 1010.0,790 L 1010.0,810" fill="none" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1022.0" y="803" font-size="13" fill="#57606a">②③④⑤ 的请求</text>
</svg></body></html>
