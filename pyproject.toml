[project]
name = "citeguard"
version = "0.1.0"
description = "Claude Code Skill/MCP that verifies academic references written by LLM agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citeguard"]
